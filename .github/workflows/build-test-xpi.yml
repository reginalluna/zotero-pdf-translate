name: Build test XPI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Zotero 9 test patch
        run: git apply .github/zotero9-auto-annotation.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Collect XPI with Toronto timestamps
        env:
          TZ: America/Toronto
        run: |
          source_xpi="$(find . -type f -name '*.xpi' -not -path './artifact/*' | head -n 1)"
          test -n "$source_xpi"
          rm -rf artifact unpacked
          mkdir -p artifact unpacked
          unzip -q "$source_xpi" -d unpacked
          find unpacked -exec touch {} +
          (cd unpacked && zip -X -qr ../artifact/zotero-pdf-translate-zotero9-auto-annotation.xpi .)
          unzip -t artifact/zotero-pdf-translate-zotero9-auto-annotation.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: zotero-pdf-translate-zotero9-auto-annotation
          path: artifact/*.xpi
          if-no-files-found: error
